<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sol–Terra–Lua — 3D (Calendário, Zoom, Órbitas até Marte) - CALIBRADO</title>
  <meta name="description" content="Simulação 3D calibrada do Sistema Solar interno com órbitas precisas, calendário correto e zoom otimizado." />
  <style>
    :root{ --bg:#000011; --panel:#ffffffe6; --ink:#0f172a; --muted:#475569; --ok:#16a34a; --bad:#ef4444; --accent:#2563eb; }
    html,body{height:100%;margin:0}
    body{background:var(--bg); color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;}
    #app{position:fixed; inset:0;}
    canvas{display:block}

    .hud{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:var(--panel); color:var(--ink);
      border:1px solid #e5e7eb; border-radius:12px; backdrop-filter: blur(12px); padding:10px 12px; width: min(1100px, calc(100vw - 24px));}
    .row{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
    .grow{flex:1}
    .btn{appearance:none; border:1px solid #cbd5e1; background:#fff; color:#111; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600}
    .btn.primary{background:var(--accent); color:#fff; border-color:#1e40af}
    .btn.play{background:var(--ok); color:#fff; border-color:#10a146}
    .btn.pause{background:var(--bad); color:#fff; border-color:#e23a3a}
    .seg{display:flex; gap:8px; align-items:center}
    .lbl{font-size:12px; color:var(--muted)}
    .title{position:fixed; top:12px; left:50%; transform:translateX(-50%); background:#0009; color:#fff; padding:8px 12px; border-radius:10px; font-weight:700; text-align:center}
    .subtitle{font-size:12px; opacity:.8}

    .datebar{position:fixed; top:12px; right:12px; background:#0009; color:#fff; border:1px solid #ffffff22; border-radius:10px; padding:8px 10px; display:flex; gap:8px; align-items:center}
    .datebar input[type="date"]{background:#111827; color:#fff; border:1px solid #374151; border-radius:6px; padding:4px 8px;}
    .pill{font-variant-numeric: tabular-nums; background:#0b1220; border:1px solid #213052; padding:4px 8px; border-radius:8px}

    @media (max-width:560px){ .hud{bottom:8px; padding:8px} .btn{padding:8px 10px} .datebar{left:50%; right:auto; transform:translateX(-50%);} }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="title">🌞 Sistema Solar interno 🌍🌝
    <div class="subtitle">Mercúrio • Vênus • Terra + Lua • Marte • Calendário e zoom • Órbitas precisas</div>
  </div>

  <div class="datebar">
    <span class="lbl">Data:</span>
    <input id="datePicker" type="date" />
    <span class="pill" id="dateText">—</span>
    <button id="todayBtn" class="btn">Hoje</button>
  </div>

  <div class="hud" id="hud">
    <div class="row">
      <button id="playPause" class="btn play">⏸️ Pausar</button>
      <div class="seg" style="min-width:260px">
        <span class="lbl">Velocidade (dias/seg)</span>
        <input id="speed" type="range" min="0.01" max="2000" step="1" value="3"/>
        <span class="pill" id="speedVal">3.00 d/s</span>
      </div>
      <div class="seg">
        <button id="zoomEarth" class="btn">🔎 Terra</button>
        <button id="zoomMars" class="btn">🟥 Marte</button>
        <button id="zoomJupiter" class="btn">🟠 Júpiter</button>
        <button id="zoomSaturn" class="btn">🪐 Saturno</button>
        <button id="zoomUranus" class="btn">🧊 Urano</button>
        <button id="zoomNeptune" class="btn">🔵 Netuno</button>
        <button id="zoomSystem" class="btn">🌌 Sistema</button>
      </div>
      <button id="toggleView" class="btn">📐 Vista Top</button>
      <label class="seg"><input id="ckLabels" type="checkbox" checked /> <span class="lbl">Rótulos</span></label>
      <label class="seg"><input id="ckTrails" type="checkbox" checked /> <span class="lbl">Trilhas</span></label>
      <label class="seg"><input id="ckStars" type="checkbox" checked /> <span class="lbl">Estrelas</span></label>
      <label class="seg"><input id="ckMoonOrbit" type="checkbox" checked /> <span class="lbl">Órbita da Lua</span></label>
      <label class="seg"><input id="ckPlanetOrbits" type="checkbox" checked /> <span class="lbl">Órbitas dos Planetas</span></label>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    // ======== CONSTANTES ASTRONÔMICAS CALIBRADAS =========
    const DEG = Math.PI / 180;
    const TAU = Math.PI * 2;
    const YEAR_D = 365.25636;       // Ano sideral terrestre
    const MOON_SIDEREAL_D = 27.321661;

    // Elementos orbitais aproximados referidos ao J2000,
    // com taxas lineares por século juliano.
    // Baseados nas aproximações de baixa precisão da NASA/JPL,
    // adequadas para visualização astronômica em escala didática.
    const PLANETS = {
      Mercury: {
        color: 0x8c7853, R: 0.008, tilt: 0.034, siderealDay: 58.646,
        texture: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', // Placeholder (Mercury texture not in threejs repo)
        elements: {
          a: [0.38709927, 0.00000037],
          e: [0.20563593, 0.00001906],
          I: [7.00497902, -0.00594749],
          L: [252.25032350, 149472.67411175],
          longPeri: [77.45779628, 0.16047689],
          longNode: [48.33076593, -0.12534081]
        }
      },
      Venus: {
        color: 0xe6cfb5, R: 0.019, tilt: 177.36, siderealDay: -243.025,
        texture: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', // Placeholder
        elements: {
          a: [0.72333566, 0.00000390],
          e: [0.00677672, -0.00004107],
          I: [3.39467605, -0.00078890],
          L: [181.97909950, 58517.81538729],
          longPeri: [131.60246718, 0.00268329],
          longNode: [76.67984255, -0.27769418]
        }
      },
      Earth: {
        color: 0x2a5d9e, R: 0.02, tilt: 23.44, siderealDay: 0.99727,
        elements: {
          a: [1.00000261, 0.00000562],
          e: [0.01671123, -0.00004392],
          I: [-0.00001531, -0.01294668],
          L: [100.46457166, 35999.37244981],
          longPeri: [102.93768193, 0.32327364],
          longNode: [0.0, 0.0]
        }
      },
      Mars: {
        color: 0xcd5c5c, R: 0.011, tilt: 25.19, siderealDay: 1.02596,
        texture: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', // Placeholder
        elements: {
          a: [1.52371034, 0.00001847],
          e: [0.09339410, 0.00007882],
          I: [1.84969142, -0.00813131],
          L: [-4.55343205, 19140.30268499],
          longPeri: [-23.94362959, 0.44441088],
          longNode: [49.55953891, -0.29257343]
        }
      },
      Jupiter: {
        color: 0xe0ae6f, R: 0.15, tilt: 3.13, siderealDay: 0.4135,
        texture: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', // Placeholder
        elements: {
          a: [5.20336301, 0.00060737],
          e: [0.04839266, -0.00012880],
          I: [1.30530, -0.00115278],
          L: [34.40438, 3034.74612],
          longPeri: [14.75385, 0.23331389],
          longNode: [100.55615, 0.33810278]
        }
      },
      Saturn: {
        color: 0xdfd195, R: 0.13, tilt: 26.73, siderealDay: 0.444,
        texture: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', // Placeholder
        elements: {
          a: [9.53707032, -0.00301530],
          e: [0.05415060, -0.00036762],
          I: [2.48446, 0.00169722],
          L: [49.94432, 1222.49443],
          longPeri: [92.43194, -0.54135833],
          longNode: [113.71504, -0.44195833]
        }
      },
      Uranus: {
        color: 0xbbe1e4, R: 0.07, tilt: 97.77, siderealDay: -0.718,
        texture: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', // Placeholder
        elements: {
          a: [19.19126393, 0.00152025],
          e: [0.04716771, -0.00019150],
          I: [0.76986, -0.00058056],
          L: [313.23218, 428.48202],
          longPeri: [170.96424, 0.3646],
          longNode: [74.22988, -0.46705556]
        }
      },
      Neptune: {
        color: 0x6081ff, R: 0.07, tilt: 28.32, siderealDay: 0.671,
        texture: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg', // Placeholder
        elements: {
          a: [30.06896348, -0.00125196],
          e: [0.00858587, 0.00002510],
          I: [1.76917, -0.00101111],
          L: [304.88003, 218.45945],
          longPeri: [44.97135, -0.23456389],
          longNode: [131.72169, -0.04201389]
        }
      }
    };

    // ======== ÉPOCA E CALENDÁRIO =========
    const J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);
    const JD_J2000 = 2451545.0;
    const MS_PER_DAY = 86400000;

    function daysSinceEpoch(ms){ return (ms - J2000)/MS_PER_DAY; }
    function isoDateFromDays(d){ return new Date(J2000 + d*MS_PER_DAY); }
    function julianDayFromSimDays(d){ return JD_J2000 + d; }
    function centuriesSinceJ2000(d){ return (julianDayFromSimDays(d) - JD_J2000) / 36525; }
    function normalizeDeg(angle){ return ((angle % 360) + 360) % 360; }
    function normalizeRad(angle){
      let v = angle % TAU;
      if(v < 0) v += TAU;
      return v;
    }

    // ======== ESCALAS CALIBRADAS =========
    const R_SUN = 0.065;
    const R_CLOUDS_SCALE = 1.025;
    const R_ATMOS_SCALE = 1.065;
    const R_MOON = 0.0054;
    const MOON_DISTANCE = 0.00257; // UA

    // ======== CENA E CÂMERA =========
    const app = document.getElementById('app');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000011);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.0001, 10000);
    camera.position.set(10, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.minDistance = 0.03;
    controls.maxDistance = 2000;

    // ======== ILUMINAÇÃO =========
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
    const sunLight = new THREE.PointLight(0xffffff, 1.8, 500);
    sunLight.position.set(0, 0, 0);

    // ======== SOL =========
    const sunGroup = new THREE.Group();
    scene.add(sunGroup);

    const sunMesh = new THREE.Mesh(
      new THREE.SphereGeometry(R_SUN, 64, 64), 
      new THREE.MeshBasicMaterial({ 
        color: 0xFFD54A,
        toneMapped: false
      })
    );
    sunGroup.add(sunMesh);
    sunGroup.add(sunLight);

    // Glow do Sol
    const sunGlowCvs = document.createElement('canvas');
    sunGlowCvs.width = 128; sunGlowCvs.height = 128;
    const gctx = sunGlowCvs.getContext('2d');
    const grad = gctx.createRadialGradient(64,64,0, 64,64,64);
    grad.addColorStop(0, 'rgba(255, 230, 120, 0.7)');
    grad.addColorStop(0.3, 'rgba(255, 180, 50, 0.3)');
    grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
    gctx.fillStyle = grad;
    gctx.fillRect(0,0,128,128);

    const sunGlowTex = new THREE.CanvasTexture(sunGlowCvs);
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: sunGlowTex,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    sunGlow.scale.set(R_SUN * 10, R_SUN * 10, 1);
    sunGroup.add(sunGlow);

    // Coroa Externa
    const outerGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: sunGlowTex,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 0.4
    }));
    outerGlow.scale.set(R_SUN * 25, R_SUN * 25, 1);
    sunGroup.add(outerGlow);

    // ======== CARREGAMENTO DE TEXTURAS =========
    const tex = new THREE.TextureLoader();
    const aniso = renderer.capabilities.getMaxAnisotropy?.() || 1;
    
    const earthColor = tex.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const earthSpec = tex.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
    const earthNormal = tex.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
    const earthClouds = tex.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
    
    [earthColor, earthSpec, earthNormal, earthClouds].forEach(t => {
      t.anisotropy = aniso;
      t.colorSpace = THREE.SRGBColorSpace;
    });

    const moonColor = tex.load('https://threejs.org/examples/textures/planets/moon_1024.jpg');
    moonColor.anisotropy = aniso;
    moonColor.colorSpace = THREE.SRGBColorSpace;

    // ======== RÓTULOS =========
    function makeLabelSprite(text){
      const cvs = document.createElement('canvas');
      const ctx = cvs.getContext('2d');
      cvs.width = 512;
      cvs.height = 256;
      ctx.font = 'bold 64px system-ui';
      const tw = ctx.measureText(text).width;
      cvs.width = Math.ceil(tw + 64);
      cvs.height = 128;
      ctx.font = 'bold 64px system-ui';
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      roundRect(ctx, 0, 0, cvs.width, cvs.height, 24);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 32, cvs.height/2 + 2);
      
      const texture = new THREE.CanvasTexture(cvs);
      texture.minFilter = THREE.LinearFilter;
      const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({ 
          map: texture, 
          transparent: true,
          depthTest: false
        })
      );
      const scale = 0.2;
      sprite.scale.set((cvs.width/cvs.height)*scale, scale, 1);
      return sprite;
    }

    function roundRect(ctx, x, y, w, h, r){
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x+rr, y);
      ctx.arcTo(x+w, y, x+w, y+h, rr);
      ctx.arcTo(x+w, y+h, x, y+h, rr);
      ctx.arcTo(x, y+h, x, y, rr);
      ctx.arcTo(x, y, x+w, y, rr);
      ctx.closePath();
    }

    // ======== CÂMERA ORTOGRÁFICA =========
    let usingOrtho = false;
    const orthoH = 35;
    const aspect = window.innerWidth/window.innerHeight;
    const cameraOrtho = new THREE.OrthographicCamera(
      -orthoH*aspect, orthoH*aspect, orthoH, -orthoH, 0.0001, 10000
    );
    cameraOrtho.position.set(0, 100, 0);
    cameraOrtho.up.set(0, 0, -1);
    cameraOrtho.lookAt(0, 0, 0);

    // ======== OBJETOS DOS PLANETAS =========
    const planetObjs = {};

    function createPlanet(name){
      const p = PLANETS[name];
      const group = new THREE.Group();

      const spinGroup = new THREE.Group();
      spinGroup.rotation.z = (p.tilt || 0) * DEG;
      group.userData.spinGroup = spinGroup;
      group.add(spinGroup);

      let mesh;

      if(name === 'Earth'){
        const earthMat = new THREE.MeshPhongMaterial({
          map: earthColor,
          specularMap: earthSpec,
          normalMap: earthNormal,
          shininess: 15,
          specular: 0x222222
        });

        mesh = new THREE.Mesh(new THREE.SphereGeometry(p.R, 72, 72), earthMat);

        const clouds = new THREE.Mesh(
          new THREE.SphereGeometry(p.R * R_CLOUDS_SCALE, 64, 64),
          new THREE.MeshLambertMaterial({
            map: earthClouds,
            transparent: true,
            depthWrite: false,
            opacity: 0.85
          })
        );

        const atmosphere = new THREE.Mesh(
          new THREE.SphereGeometry(p.R * R_ATMOS_SCALE, 48, 48),
          new THREE.MeshPhongMaterial({
            color: 0x4488ff,
            transparent: true,
            opacity: 0.08,
            side: THREE.BackSide
          })
        );

        spinGroup.add(mesh);
        spinGroup.add(clouds);
        spinGroup.add(atmosphere);
        group.userData.clouds = clouds;

      } else {
        const material = new THREE.MeshStandardMaterial({
          color: p.color,
          roughness: 0.8,
          metalness: 0.1
        });

        if(p.texture){
          const pTex = tex.load(p.texture);
          pTex.anisotropy = aniso;
          pTex.colorSpace = THREE.SRGBColorSpace;
          material.map = pTex;
        }

        mesh = new THREE.Mesh(new THREE.SphereGeometry(p.R, 64, 64), material);
        spinGroup.add(mesh);

        if(name === 'Saturn'){
          const ringGeo = new THREE.RingGeometry(p.R * 1.4, p.R * 2.2, 64);
          const ringMat = new THREE.MeshStandardMaterial({
            color: 0xdfd195,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.6
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = Math.PI / 2;
          spinGroup.add(ring);
        }
      }

      // Rótulo
      const labelNames = {
        Mercury: 'Mercúrio',
        Venus: 'Vênus', 
        Earth: 'Terra',
        Mars: 'Marte',
        Jupiter: 'Júpiter',
        Saturn: 'Saturno',
        Uranus: 'Urano',
        Neptune: 'Netuno'
      };
      const label = makeLabelSprite(labelNames[name]);
      group.add(label);
      label.position.set(0, p.R + 0.025, 0);
      scene.add(group);

      // Linha de órbita atualizada a partir dos elementos do instante
      const orbitGeometry = new THREE.BufferGeometry();
      const orbitLine = new THREE.Line(
        orbitGeometry,
        new THREE.LineBasicMaterial({
          color: 0x88aaff,
          transparent: true,
          opacity: 0.4,
          linewidth: 1
        })
      );
      scene.add(orbitLine);

      planetObjs[name] = { group, mesh, spinGroup, label, orbitLine };
      updatePlanetOrbitLine(name, 0);
    }

    // Criar todos os planetas
    createPlanet('Mercury');
    createPlanet('Venus');
    createPlanet('Earth');
    createPlanet('Mars');
    createPlanet('Jupiter');
    createPlanet('Saturn');
    createPlanet('Uranus');
    createPlanet('Neptune');

    // ======== LUA =========
    const moonGroup = new THREE.Group();
    const moonMesh = new THREE.Mesh(
      new THREE.SphereGeometry(R_MOON, 48, 48),
      new THREE.MeshStandardMaterial({
        map: moonColor,
        roughness: 1.0,
        metalness: 0.0
      })
    );
    moonGroup.add(moonMesh);
    scene.add(moonGroup);

    const labelMoon = makeLabelSprite('Lua');
    moonGroup.add(labelMoon);
    labelMoon.position.set(0, R_MOON + 0.018, 0);

    // Guia da órbita lunar (recalculado dinamicamente em torno da Terra)
    const moonOrbitGeometry = new THREE.BufferGeometry();
    const moonOrbitGuide = new THREE.Line(
      moonOrbitGeometry,
      new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.28
      })
    );
    scene.add(moonOrbitGuide);

    // ======== TRILHAS =========
    const trailLengths = {
      Earth: 280,
      Moon: 180,
      Mercury: 200,
      Venus: 220,
      Mars: 260,
      Jupiter: 300,
      Saturn: 320,
      Uranus: 340,
      Neptune: 360
    };

    const trails = {};

    function createTrail(length){
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(length * 3);
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      
      const line = new THREE.Line(
        geometry,
        new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.6,
          depthWrite: false
        })
      );
      scene.add(line);
      return { geometry, positions, line, length };
    }

    trails.Earth = createTrail(trailLengths.Earth);
    trails.Moon = createTrail(trailLengths.Moon);
    trails.Mercury = createTrail(trailLengths.Mercury);
    trails.Venus = createTrail(trailLengths.Venus);
    trails.Mars = createTrail(trailLengths.Mars);
    trails.Jupiter = createTrail(trailLengths.Jupiter);
    trails.Saturn = createTrail(trailLengths.Saturn);
    trails.Uranus = createTrail(trailLengths.Uranus);
    trails.Neptune = createTrail(trailLengths.Neptune);

    function updateTrail(position, trail){
      const { positions, length } = trail;
      
      // Desloca posições existentes
      for(let i = 0; i < (length - 1) * 3; i++){
        positions[i] = positions[i + 3];
      }
      
      // Adiciona nova posição
      positions[(length - 1) * 3] = position.x;
      positions[(length - 1) * 3 + 1] = position.y;
      positions[(length - 1) * 3 + 2] = position.z;
      
      trail.geometry.attributes.position.needsUpdate = true;
    }

    // ======== CÁLCULOS ORBITAIS =========
    function keplerSolveE(M, e, iterations = 12){
      const Mnorm = normalizeRad(M);
      let E = e < 0.8 ? Mnorm : Math.PI;

      for(let i = 0; i < iterations; i++){
        const f = E - e * Math.sin(E) - Mnorm;
        const fPrime = 1 - e * Math.cos(E);
        const delta = f / fPrime;
        E -= delta;
        if(Math.abs(delta) < 1e-10) break;
      }
      return E;
    }

    function orbitalElementsAtCentury(name, Tcent){
      const src = PLANETS[name].elements;
      return {
        a: src.a[0] + src.a[1] * Tcent,
        e: src.e[0] + src.e[1] * Tcent,
        I: (src.I[0] + src.I[1] * Tcent) * DEG,
        L: normalizeDeg(src.L[0] + src.L[1] * Tcent) * DEG,
        longPeri: normalizeDeg(src.longPeri[0] + src.longPeri[1] * Tcent) * DEG,
        longNode: normalizeDeg(src.longNode[0] + src.longNode[1] * Tcent) * DEG
      };
    }

    function heliocentricFromElements(el, meanAnomalyOverride = null){
      const M = meanAnomalyOverride == null
        ? normalizeRad(el.L - el.longPeri)
        : normalizeRad(meanAnomalyOverride);

      const E = keplerSolveE(M, el.e);
      const xv = el.a * (Math.cos(E) - el.e);
      const yv = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
      const v = Math.atan2(yv, xv);
      const r = Math.hypot(xv, yv);
      const argPeri = el.longPeri - el.longNode;

      const cosO = Math.cos(el.longNode), sinO = Math.sin(el.longNode);
      const cosI = Math.cos(el.I), sinI = Math.sin(el.I);
      const cosVW = Math.cos(v + argPeri), sinVW = Math.sin(v + argPeri);

      return new THREE.Vector3(
        r * (cosO * cosVW - sinO * sinVW * cosI),
        r * (sinO * cosVW + cosO * sinVW * cosI),
        r * (sinVW * sinI)
      );
    }

    function planetHeliocentricPosition(name, simDaysValue){
      const Tcent = centuriesSinceJ2000(simDaysValue);
      const el = orbitalElementsAtCentury(name, Tcent);
      return heliocentricFromElements(el);
    }

    // Lua geocêntrica aproximada com principais termos periódicos.
    // Já é significativamente mais fiel do que um círculo kepleriano simples.
    function moonGeocentricPosition(simDaysValue){
      const Tcent = centuriesSinceJ2000(simDaysValue);

      const L0 = normalizeDeg(218.3164477 + 481267.88123421 * Tcent);
      const D  = normalizeDeg(297.8501921 + 445267.1114034  * Tcent);
      const M  = normalizeDeg(357.5291092 + 35999.0502909   * Tcent);
      const Mp = normalizeDeg(134.9633964 + 477198.8675055  * Tcent);
      const F  = normalizeDeg(93.2720950  + 483202.0175233  * Tcent);

      const lon = L0
        + 6.289 * Math.sin(Mp * DEG)
        + 1.274 * Math.sin((2*D - Mp) * DEG)
        + 0.658 * Math.sin((2*D) * DEG)
        + 0.214 * Math.sin((2*Mp) * DEG)
        - 0.186 * Math.sin(M * DEG)
        - 0.114 * Math.sin((2*F) * DEG)
        + 0.059 * Math.sin((2*D - 2*Mp) * DEG)
        + 0.057 * Math.sin((2*D - M - Mp) * DEG)
        + 0.053 * Math.sin((2*D + Mp) * DEG)
        + 0.046 * Math.sin((2*D - M) * DEG);

      const lat =
        5.128 * Math.sin(F * DEG)
        + 0.280 * Math.sin((Mp + F) * DEG)
        + 0.277 * Math.sin((Mp - F) * DEG)
        + 0.173 * Math.sin((2*D - F) * DEG)
        + 0.055 * Math.sin((2*D - Mp + F) * DEG)
        + 0.046 * Math.sin((2*D - Mp - F) * DEG)
        + 0.033 * Math.sin((2*D + F) * DEG)
        + 0.017 * Math.sin((2*Mp + F) * DEG)
        + 0.009 * Math.sin((2*D + Mp - F) * DEG)
        + 0.009 * Math.sin((2*D - M + F) * DEG);

      const distanceKm =
        385000.56
        - 20905.355 * Math.cos(Mp * DEG)
        - 3699.111  * Math.cos((2*D - Mp) * DEG)
        - 2955.968  * Math.cos((2*D) * DEG)
        - 569.925   * Math.cos((2*Mp) * DEG)
        + 246.158   * Math.cos((2*Mp - 2*D) * DEG)
        - 204.586   * Math.cos((M - 2*D) * DEG)
        - 170.733   * Math.cos((M + Mp - 2*D) * DEG)
        - 152.137   * Math.cos((M + Mp) * DEG);

      const distanceAU = distanceKm / 149597870.7;
      const lambda = lon * DEG;
      const beta = lat * DEG;
      const cosB = Math.cos(beta);

      return new THREE.Vector3(
        distanceAU * cosB * Math.cos(lambda),
        distanceAU * cosB * Math.sin(lambda),
        distanceAU * Math.sin(beta)
      );
    }

    function updatePlanetOrbitLine(name, Tcent){
      const el = orbitalElementsAtCentury(name, Tcent);
      const points = [];
      const steps = 720;

      for(let i = 0; i <= steps; i++){
        const M = TAU * i / steps;
        points.push(heliocentricFromElements(el, M));
      }

      planetObjs[name].orbitLine.geometry.setFromPoints(points);
    }

    function updateMoonOrbitLine(simDaysValue){
      const earthPos = planetObjs.Earth.group.position.clone();
      const points = [];
      const steps = 220;

      for(let i = 0; i <= steps; i++){
        const futureDays = simDaysValue + (MOON_SIDEREAL_D * i / steps);
        const rel = moonGeocentricPosition(futureDays);
        points.push(earthPos.clone().add(rel));
      }

      moonOrbitGuide.geometry.setFromPoints(points);
    }

    // ======== ESTADO DA SIMULAÇÃO =========
    let playing = true;
    let speedDaysPerSec = 3;
    let showLabels = true;
    let showTrails = true;
    let showStars = true;
    let showMoonOrbit = true;
    let showPlanetOrbits = true;
    let lastOrbitRefreshDay = Number.NaN;

    // Data inicial calibrada
    const todayUTC = new Date();
    const startDays = daysSinceEpoch(
      Date.UTC(todayUTC.getUTCFullYear(), todayUTC.getUTCMonth(), todayUTC.getUTCDate())
    );
    let simDays = startDays;
    let lastTime = performance.now();

    // ======== REFERÊNCIAS DA UI =========
    const elPlay = document.getElementById('playPause');
    const elSpeed = document.getElementById('speed');
    const elSpeedVal = document.getElementById('speedVal');
    const elToggleView = document.getElementById('toggleView');
    const elCkLabels = document.getElementById('ckLabels');
    const elCkTrails = document.getElementById('ckTrails');
    const elCkStars = document.getElementById('ckStars');
    const elCkMoonOrbit = document.getElementById('ckMoonOrbit');
    const elCkPlanetOrbits = document.getElementById('ckPlanetOrbits');
    const elDatePicker = document.getElementById('datePicker');
    const elDateText = document.getElementById('dateText');
    const elToday = document.getElementById('todayBtn');
    const btnZoomEarth = document.getElementById('zoomEarth');
    const btnZoomSystem = document.getElementById('zoomSystem');
    const btnZoomMars = document.getElementById('zoomMars');
    const btnZoomJupiter = document.getElementById('zoomJupiter');
    const btnZoomSaturn = document.getElementById('zoomSaturn');
    const btnZoomUranus = document.getElementById('zoomUranus');
    const btnZoomNeptune = document.getElementById('zoomNeptune');

    function updateDateUI(){
      const date = isoDateFromDays(simDays);
      const isoString = date.toISOString().slice(0, 10);
      elDateText.textContent = isoString;
      elDatePicker.value = isoString;
    }
    updateDateUI();

    // ======== LOOP PRINCIPAL =========
    function animate(currentTime){
      const deltaTime = (currentTime - lastTime) / 1000;
      lastTime = currentTime;
      
      if(playing){
        simDays += speedDaysPerSec * deltaTime;
      }

      // Atualizar posições dos planetas
      const positions = {};
      
      for(const name of Object.keys(PLANETS)){
        const p = PLANETS[name];
        const pos = planetHeliocentricPosition(name, simDays);
        planetObjs[name].group.position.copy(pos);
        positions[name] = pos;

        // Rotação Sideral Sincronizada
        const siderealDay = p.siderealDay || 1.0;
        const spinAngle = TAU * ((simDays / siderealDay) % 1);
        planetObjs[name].mesh.rotation.y = spinAngle;

        if(name === 'Earth' && planetObjs[name].group.userData.clouds){
          planetObjs[name].group.userData.clouds.rotation.y = spinAngle * 1.015;
        }
      }

      if(!Number.isFinite(lastOrbitRefreshDay) || Math.abs(simDays - lastOrbitRefreshDay) > 4){
        const Tcent = centuriesSinceJ2000(simDays);
        for(const name of Object.keys(planetObjs)){
          updatePlanetOrbitLine(name, Tcent);
        }
        updateMoonOrbitLine(simDays);
        lastOrbitRefreshDay = simDays;
      }

      // Posição da Lua
      const moonRelative = moonGeocentricPosition(simDays);
      const moonPosition = positions.Earth.clone().add(moonRelative);
      moonGroup.position.copy(moonPosition);
      
      // Rotação sincronizada da Lua (Tidal Locking Perfeito)
      // A face visível da Lua (Z+) sempre aponta para a Terra.
      moonGroup.lookAt(positions.Earth);

      // Atualizar trilhas
      if(showTrails){
        updateTrail(planetObjs.Earth.group.position, trails.Earth);
        updateTrail(moonGroup.position, trails.Moon);
        updateTrail(planetObjs.Mercury.group.position, trails.Mercury);
        updateTrail(planetObjs.Venus.group.position, trails.Venus);
        updateTrail(planetObjs.Mars.group.position, trails.Mars);
        updateTrail(planetObjs.Jupiter.group.position, trails.Jupiter);
        updateTrail(planetObjs.Saturn.group.position, trails.Saturn);
        updateTrail(planetObjs.Uranus.group.position, trails.Uranus);
        updateTrail(planetObjs.Neptune.group.position, trails.Neptune);
      }
      
      // Visibilidade das trilhas
      trails.Earth.line.visible = showTrails;
      trails.Moon.line.visible = showTrails;
      trails.Mercury.line.visible = showTrails;
      trails.Venus.line.visible = showTrails;
      trails.Mars.line.visible = showTrails;
      trails.Jupiter.line.visible = showTrails;
      trails.Saturn.line.visible = showTrails;
      trails.Uranus.line.visible = showTrails;
      trails.Neptune.line.visible = showTrails;

      // Visibilidade das órbitas
      for(const name of Object.keys(planetObjs)){
        planetObjs[name].orbitLine.visible = showPlanetOrbits;
      }
      moonOrbitGuide.visible = showMoonOrbit;

      // Estrelas
      starsGroup.visible = showStars;

      // Renderização
      controls.update();
      if(usingOrtho){
        renderer.render(scene, cameraOrtho);
      } else {
        renderer.render(scene, camera);
      }

      // Atualizar UI periodicamente
      if(Math.floor(currentTime * 10) % 8 === 0){
        updateDateUI();
      }
      
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // ======== ESTRELAS =========
    const starsGroup = new THREE.Group();
    scene.add(starsGroup);
    createStars();
    
    function createStars(){
      starsGroup.clear();
      const starCount = 7000;
      const positions = new Float32Array(starCount * 3);
      const colors = new Float32Array(starCount * 3);
      const sizes = new Float32Array(starCount);
      
      for(let i = 0; i < starCount; i++){
        const radius = 100 + Math.random() * 200;
        const phi = Math.acos(2 * Math.random() - 1);
        const theta = 2 * Math.PI * Math.random();
        
        positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = radius * Math.cos(phi);

        // Cores sutis (branco, leve azul, leve amarelo)
        const type = Math.random();
        if(type > 0.9){ // Leve Azul
          colors[i*3] = 0.8; colors[i*3+1] = 0.85; colors[i*3+2] = 1.0;
        } else if(type > 0.8){ // Leve Amarelo
          colors[i*3] = 1.0; colors[i*3+1] = 0.95; colors[i*3+2] = 0.8;
        } else { // Branco
          colors[i*3] = 1.0; colors[i*3+1] = 1.0; colors[i*3+2] = 1.0;
        }

        sizes[i] = 0.05 + Math.random() * 0.15;
      }
      
      const starGeometry = new THREE.BufferGeometry();
      starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      starGeometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
      
      const starMaterial = new THREE.PointsMaterial({
        size: 0.15,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        sizeAttenuation: true
      });
      
      const stars = new THREE.Points(starGeometry, starMaterial);
      starsGroup.add(stars);
    }

    // ======== EVENTOS DA UI =========
    elPlay.addEventListener('click', () => {
      playing = !playing;
      elPlay.textContent = playing ? '⏸️ Pausar' : '▶️ Reproduzir';
      elPlay.className = 'btn ' + (playing ? 'play' : 'pause');
    });

    elSpeed.addEventListener('input', (e) => {
      speedDaysPerSec = parseFloat(e.target.value);
      elSpeedVal.textContent = speedDaysPerSec.toFixed(2) + ' d/s';
    });

    elToggleView.addEventListener('click', () => {
      usingOrtho = !usingOrtho;
      elToggleView.textContent = usingOrtho ? '👁️ Vista 3D' : '📐 Vista Top';
      controls.enableRotate = !usingOrtho;
    });

    elCkLabels.addEventListener('change', (e) => {
      showLabels = e.target.checked;
      for(const name of Object.keys(planetObjs)){
        planetObjs[name].label.visible = showLabels;
      }
      labelMoon.visible = showLabels;
    });

    elCkTrails.addEventListener('change', (e) => {
      showTrails = e.target.checked;
    });

    elCkStars.addEventListener('change', (e) => {
      showStars = e.target.checked;
    });

    elCkMoonOrbit.addEventListener('change', (e) => {
      showMoonOrbit = e.target.checked;
    });

    elCkPlanetOrbits.addEventListener('change', (e) => {
      showPlanetOrbits = e.target.checked;
    });

    elDatePicker.addEventListener('change', () => {
      const date = elDatePicker.valueAsDate;
      if(date){
        simDays = daysSinceEpoch(
          Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate())
        );
      }
    });

    elToday.addEventListener('click', () => {
      const now = new Date();
      simDays = daysSinceEpoch(
        Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate())
      );
      updateDateUI();
    });

    // Funções de zoom
    btnZoomEarth.addEventListener('click', () => {
      smoothZoomTo(planetObjs.Earth.group.position, 0.1);
    });

    btnZoomSystem.addEventListener('click', () => {
      smoothZoomTo(new THREE.Vector3(0, 0, 0), 45.0);
    });

    btnZoomMars.addEventListener('click', () => {
      smoothZoomTo(planetObjs.Mars.group.position, 0.15);
    });

    btnZoomJupiter.addEventListener('click', () => {
      smoothZoomTo(planetObjs.Jupiter.group.position, 0.8);
    });

    btnZoomSaturn.addEventListener('click', () => {
      smoothZoomTo(planetObjs.Saturn.group.position, 1.0);
    });

    btnZoomUranus.addEventListener('click', () => {
      smoothZoomTo(planetObjs.Uranus.group.position, 0.6);
    });

    btnZoomNeptune.addEventListener('click', () => {
      smoothZoomTo(planetObjs.Neptune.group.position, 0.6);
    });

    function smoothZoomTo(target, distance){
      const direction = camera.position.clone().sub(controls.target).normalize();
      controls.target.copy(target);
      const newPosition = target.clone().add(direction.multiplyScalar(distance));
      animateTo(camera.position, newPosition, 400);
    }

    function animateTo(vector, target, duration){
      const start = vector.clone();
      const startTime = performance.now();
      
      function update(){
        const elapsed = performance.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        
        vector.lerpVectors(start, target, eased);
        
        if(progress < 1){
          requestAnimationFrame(update);
        }
      }
      requestAnimationFrame(update);
    }

    // ======== REDIMENSIONAMENTO =========
    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      renderer.setSize(width, height);
      
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      
      const orthoAspect = width / height;
      cameraOrtho.left = -orthoH * orthoAspect;
      cameraOrtho.right = orthoH * orthoAspect;
      cameraOrtho.updateProjectionMatrix();
    }, { passive: true });

    // ======== TESTES AUTOMÁTICOS =========
    (function runTests(){
      console.log('🔧 Executando testes de calibração...');
      
      const tests = [];
      
      function test(name, condition){
        tests.push({ name, passed: !!condition });
      }
      
      test('THREE carregado', typeof THREE !== 'undefined');
      test('Controles orbitais funcionais', typeof OrbitControls !== 'undefined');
      test('Renderer WebGL criado', renderer instanceof THREE.WebGLRenderer);
      test('Cena criada', scene instanceof THREE.Scene);
      test('Sol posicionado', sunGroup.position.length() < 0.001);
      test('Terra criada', planetObjs.Earth && planetObjs.Earth.mesh.isMesh);
      test('Lua criada', moonMesh && moonMesh.isMesh);
      test('Mercúrio criado', planetObjs.Mercury && planetObjs.Mercury.mesh.isMesh);
      test('Vênus criado', planetObjs.Venus && planetObjs.Venus.mesh.isMesh);
      test('Marte criado', planetObjs.Mars && planetObjs.Mars.mesh.isMesh);
      test('Netuno criado', planetObjs.Neptune && planetObjs.Neptune.mesh.isMesh);
      
      // Teste de órbitas
      setTimeout(() => {
        const earthPos = planetObjs.Earth.group.position;
        const earthDist = earthPos.length();
        test('Terra ~1 UA', earthDist > 0.98 && earthDist < 1.02);
        
        const marsPos = planetObjs.Mars.group.position;
        const marsDist = marsPos.length();
        test('Marte ~1.5 UA', marsDist > 1.4 && marsDist < 1.6);

        const neptunePos = planetObjs.Neptune.group.position;
        const neptuneDist = neptunePos.length();
        test('Netuno ~30 UA', neptuneDist > 29 && neptuneDist < 31);
        
        // Log dos resultados
        console.log('📊 Resultados dos testes:');
        tests.forEach(t => {
          console.log(
            `%c${t.name}: ${t.passed ? 'PASS' : 'FAIL'}`,
            `color: ${t.passed ? '#16a34a' : '#ef4444'}`
          );
        });
        
        if(tests.every(t => t.passed)){
          console.log('🎉 Todos os testes passaram! Sistema calibrado.');
        } else {
          console.warn('⚠️ Alguns testes falharam. Verifique a calibração.');
        }
      }, 1000);
    })();
  </script>
