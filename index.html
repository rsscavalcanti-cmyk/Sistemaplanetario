<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sol–Terra–Lua — 3D (Calendário, Zoom, Órbitas até Marte)</title>
  <meta name="description" content="Simulação 3D Sol–Terra–Lua com Terra e Lua realistas, órbitas claras, calendário correndo, zoom rápido e planetas até Marte (Mercúrio, Vênus, Terra, Marte) com elementos keplerianos aproximados." />
  <style>
    :root{ --bg:#000011; --panel:#ffffffe6; --ink:#0f172a; --muted:#475569; --ok:#16a34a; --bad:#ef4444; --accent:#2563eb; }
    html,body{height:100%;margin:0}
    body{background:var(--bg); color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;}
    #app{position:fixed; inset:0;}
    canvas{display:block}

    .hud{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:var(--panel); color:var(--ink);
      border:1px solid #e5e7eb; border-radius:12px; backdrop-filter: blur(12px); padding:10px 12px; width: min(1100px, calc(100vw - 24px));}
    .row{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
    .grow{flex:1}
    .btn{appearance:none; border:1px solid #cbd5e1; background:#fff; color:#111; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600}
    .btn.primary{background:var(--accent); color:#fff; border-color:#1e40af}
    .btn.play{background:var(--ok); color:#fff; border-color:#10a146}
    .btn.pause{background:var(--bad); color:#fff; border-color:#e23a3a}
    .seg{display:flex; gap:8px; align-items:center}
    .lbl{font-size:12px; color:var(--muted)}
    .title{position:fixed; top:12px; left:50%; transform:translateX(-50%); background:#0009; color:#fff; padding:8px 12px; border-radius:10px; font-weight:700; text-align:center}
    .subtitle{font-size:12px; opacity:.8}

    .datebar{position:fixed; top:12px; right:12px; background:#0009; color:#fff; border:1px solid #ffffff22; border-radius:10px; padding:8px 10px; display:flex; gap:8px; align-items:center}
    .datebar input[type="date"]{background:#111827; color:#fff; border:1px solid #374151; border-radius:6px; padding:4px 8px;}
    .pill{font-variant-numeric: tabular-nums; background:#0b1220; border:1px solid #213052; padding:4px 8px; border-radius:8px}

    @media (max-width:560px){ .hud{bottom:8px; padding:8px} .btn{padding:8px 10px} .datebar{left:50%; right:auto; transform:translateX(-50%);} }
  </style>

  <!-- Import Map para módulos no sandbox -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="title">🌞 Sistema Solar interno 🌍🌝
    <div class="subtitle">Mercúrio • Vênus • Terra + Lua • Marte • Calendário e zoom • Órbitas aproximadas</div>
  </div>

  <div class="datebar">
    <span class="lbl">Data:</span>
    <input id="datePicker" type="date" />
    <span class="pill" id="dateText">—</span>
    <button id="todayBtn" class="btn">Hoje</button>
  </div>

  <div class="hud" id="hud">
    <div class="row">
      <button id="playPause" class="btn play">⏸️ Pausar</button>
      <div class="seg" style="min-width:260px">
        <span class="lbl">Velocidade (dias/seg)</span>
        <input id="speed" type="range" min="0.01" max="200" step="0.01" value="3"/>
        <span class="pill" id="speedVal">3.00 d/s</span>
      </div>
      <div class="seg">
        <button id="zoomEarth" class="btn">🔎 Zoom Terra</button>
        <button id="zoomSystem" class="btn">🌌 Zoom Sistema</button>
        <button id="zoomMars" class="btn">🟥 Zoom Marte</button>
      </div>
      <button id="toggleView" class="btn">📐 Vista Top</button>
      <label class="seg"><input id="ckLabels" type="checkbox" checked /> <span class="lbl">Rótulos</span></label>
      <label class="seg"><input id="ckTrails" type="checkbox" checked /> <span class="lbl">Trilhas</span></label>
      <label class="seg"><input id="ckStars" type="checkbox" checked /> <span class="lbl">Estrelas</span></label>
      <label class="seg"><input id="ckMoonOrbit" type="checkbox" checked /> <span class="lbl">Órbita da Lua</span></label>
      <label class="seg"><input id="ckPlanetOrbits" type="checkbox" checked /> <span class="lbl">Órbitas dos Planetas</span></label>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    // ======== Constantes astronômicas (aprox.) =========
    const DEG = Math.PI / 180;
    const YEAR_D = 365.256;    // Terra (sidéreo)
    const MOON_D = 27.321661;  // Lua (sidéreo)

    // Planetas até Marte — elementos médios aproximados (época perto de J2000)
    const PLANETS = {
      Mercury: { T: 87.969,   a: 0.387098, e: 0.205630, i: 7.005*DEG,   O: 48.331*DEG,  w: 29.124*DEG,   color: 0xb1a38f, R: 0.007 },
      Venus:   { T: 224.701,  a: 0.723332, e: 0.006772, i: 3.394*DEG,   O: 76.680*DEG,  w: 54.884*DEG,   color: 0xc8b7a6, R: 0.017 },
      Earth:   { T: YEAR_D,   a: 1.000000, e: 0.016708, i: 0*DEG,       O: 0*DEG,       w: 102.937*DEG,  color: 0x2a5d9e, R: 0.018 },
      Mars:    { T: 686.980,  a: 1.523679, e: 0.093400, i: 1.850*DEG,   O: 49.558*DEG,  w: 286.502*DEG,  color: 0xba4a3c, R: 0.010 }
    };

    // ======== Época e calendário =========
    const J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);
    const MS_PER_DAY = 86400000;
    function daysSinceEpoch(ms){ return (ms - J2000)/MS_PER_DAY; }
    function isoDateFromDays(d){ return new Date(J2000 + d*MS_PER_DAY); }

    // ======== Tamanhos extras =========
    const R_SUN = 0.06;
    const R_CLOUDS_SCALE = 1.02;
    const R_ATMOS_SCALE = 1.06;
    const R_MOON = 0.0068;

    // ======== Cena e câmera =========
    const app = document.getElementById('app');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000011);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.0005, 5000);
    camera.position.set(2.8, 1.4, 2.8);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.06;
    controls.minDistance = 0.04;  // bem perto da Terra
    controls.maxDistance = 40;    // ver até Marte confortavelmente

    // ======== Luzes =========
    scene.add(new THREE.AmbientLight(0xffffff, 0.25));
    const sunLight = new THREE.PointLight(0xffffff, 1.6, 400);

    // ======== Sol =========
    const sun = new THREE.Mesh(new THREE.SphereGeometry(R_SUN, 48, 48), new THREE.MeshBasicMaterial({ color: 0xFFD54A }));
    sun.add(sunLight); scene.add(sun);

    // ======== Carregar texturas (Terra/Lua) =========
    const tex = new THREE.TextureLoader(); const aniso = renderer.capabilities.getMaxAnisotropy?.() || 1;
    const earthColor   = tex.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const earthSpec    = tex.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
    const earthNormal  = tex.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
    const earthClouds  = tex.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
    [earthColor, earthSpec, earthNormal, earthClouds].forEach(t=> t.anisotropy = aniso);
    const moonColor    = tex.load('https://threejs.org/examples/textures/planets/moon_1024.jpg'); moonColor.anisotropy = aniso;

    // ======== Util rótulos =========
    function makeLabelSprite(text){
      const cvs=document.createElement('canvas'); const ctx=cvs.getContext('2d'); cvs.width=512; cvs.height=256; ctx.font='bold 64px system-ui';
      const tw=ctx.measureText(text).width; cvs.width=Math.ceil(tw+64); cvs.height=128; ctx.font='bold 64px system-ui';
      ctx.fillStyle='rgba(0,0,0,0.7)'; roundRect(ctx,0,0,cvs.width,cvs.height,24); ctx.fill(); ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.fillText(text,32,cvs.height/2+2);
      const t=new THREE.CanvasTexture(cvs); t.minFilter=THREE.LinearFilter; const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true})); const s=0.18; spr.scale.set((cvs.width/cvs.height)*s,s,1); return spr;
    }
    function roundRect(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();}

    // ======== Câmera ortográfica (vista top) =========
    let usingOrtho=false; // ÚNICA declaração — evitar duplicatas
    const orthoH=6; const aspect=window.innerWidth/window.innerHeight;
    const cameraOrtho=new THREE.OrthographicCamera(-orthoH*aspect,orthoH*aspect,orthoH,-orthoH,0.0001,5000);
    cameraOrtho.position.set(0,6,0); cameraOrtho.up.set(0,0,-1); cameraOrtho.lookAt(0,0,0);

    // ======== Órbitas e objetos dos planetas =========
    const planetObjs = {}; // nome -> { group, mesh, label, orbitLine }

    function createPlanet(name){
      const p = PLANETS[name];
      const group = new THREE.Group();
      let mesh;
      if(name==='Earth'){
        // Terra especial com clouds/atmosfera
        const tilt = 23.44*DEG; group.rotation.z = tilt;
        const mat = new THREE.MeshPhongMaterial({ map: earthColor, specularMap: earthSpec, normalMap: earthNormal, shininess: 12 });
        const m = new THREE.Mesh(new THREE.SphereGeometry(p.R, 64, 64), mat);
        const clouds = new THREE.Mesh(new THREE.SphereGeometry(p.R*R_CLOUDS_SCALE, 64, 64), new THREE.MeshLambertMaterial({ map: earthClouds, transparent:true, depthWrite:false, opacity:0.9 }));
        const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(p.R*R_ATMOS_SCALE, 48, 48), new THREE.MeshPhongMaterial({ color:0x66aaff, transparent:true, opacity:0.06, side:THREE.BackSide }));
        group.add(m); group.add(clouds); group.add(atmosphere);
        mesh = m;
        group.userData.clouds = clouds;
      } else {
        mesh = new THREE.Mesh(new THREE.SphereGeometry(p.R, 48, 48), new THREE.MeshStandardMaterial({ color: p.color, roughness:0.9 }));
        group.add(mesh);
      }
      const label = makeLabelSprite(name==='Mercury'?'Mercúrio': name==='Venus'?'Vênus': name==='Earth'?'Terra':'Marte');
      group.add(label); label.position.set(0, p.R+0.02, 0);
      scene.add(group);

      // Órbita
      const orbitGeom=new THREE.BufferGeometry(); const pts=[]; const steps=384;
      for(let k=0;k<=steps;k++){
        const M=(2*Math.PI*k)/steps; const E=keplerSolveE(M,p.e);
        const r=p.a*(1 - p.e*Math.cos(E));
        const nu=Math.atan2(Math.sqrt(1 - p.e*p.e)*Math.sin(E), Math.cos(E) - p.e);
        const x=r*Math.cos(nu), y=r*Math.sin(nu);
        // rotações por w, i, O
        const cosw=Math.cos(p.w), sinw=Math.sin(p.w);
        const cosO=Math.cos(p.O), sinO=Math.sin(p.O);
        const cosi=Math.cos(p.i), sini=Math.sin(p.i);
        const x1 = x*cosw - y*sinw; const y1 = x*sinw + y*cosw; const z1=0;
        const x2 = x1; const y2 = y1*cosi - z1*sini; const z2 = y1*sini + z1*cosi;
        const X = x2*cosO - y2*sinO; const Y = x2*sinO + y2*cosO; const Z = z2;
        pts.push(X,Y,Z);
      }
      orbitGeom.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
      const orbitLine=new THREE.Line(orbitGeom, new THREE.LineBasicMaterial({ color:0x9ca3af, transparent:true, opacity:0.35 }));
      scene.add(orbitLine);

      planetObjs[name] = { group, mesh, label, orbitLine };
    }

    // Criar planetas
    createPlanet('Mercury');
    createPlanet('Venus');
    createPlanet('Earth');
    createPlanet('Mars');

    // ======== Lua (presa ao sistema Terra) =========
    const moonGroup = new THREE.Group();
    const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(R_MOON, 48, 48), new THREE.MeshStandardMaterial({ map: moonColor, roughness:1.0, metalness:0.0 }));
    moonGroup.add(moonMesh); scene.add(moonGroup);
    const labelMoon=makeLabelSprite('Lua'); moonGroup.add(labelMoon); labelMoon.position.set(0,R_MOON+0.015,0);

    // Guia da órbita lunar (plano local da Terra)
    const moonOrbitGeom=new THREE.RingGeometry(0.00257*0.999, 0.00257*1.001, 256);
    const moonOrbitMat=new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.4, side:THREE.DoubleSide });
    const moonOrbitGuide=new THREE.Mesh(moonOrbitGeom, moonOrbitMat);
    moonOrbitGuide.rotation.x=Math.PI/2;
    planetObjs.Earth.group.add(moonOrbitGuide);

    // ======== Trilhas =========
    const trailLen = { Earth:240, Moon:160, Mercury:180, Venus:200, Mars:240 };
    const trails = {};
    function makeTrail(len){ const g=new THREE.BufferGeometry(); const arr=new Float32Array(len*3); g.setAttribute('position', new THREE.BufferAttribute(arr,3)); const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff})); scene.add(line); return {g,arr,line,len}; }
    trails.Earth = makeTrail(trailLen.Earth);
    trails.Moon  = makeTrail(trailLen.Moon);
    trails.Mercury = makeTrail(trailLen.Mercury);
    trails.Venus   = makeTrail(trailLen.Venus);
    trails.Mars    = makeTrail(trailLen.Mars);
    function pushTrail(v, tr){ const {arr,len,line} = tr; for(let i=0;i<(len-1)*3;i++){arr[i]=arr[i+3];} arr[(len-1)*3]=v.x; arr[(len-1)*3+1]=v.y; arr[(len-1)*3+2]=v.z; line.geometry.attributes.position.needsUpdate=true; }

    // ======== Kepler utilities =========
    function keplerSolveE(M,e,iters=7){ let E=M; for(let i=0;i<iters;i++){ const f=E-e*Math.sin(E)-M; const fp=1-e*Math.cos(E); E-=f/fp;} return E; }
    function orbitalPosition({t,T,a,e,incl=0,omega_node=0,arg_peri=0}){
      const n=(2*Math.PI)/T; const M0=(n*t)%(2*Math.PI); const M=M0<0?M0+2*Math.PI:M0; const E=keplerSolveE(M,e);
      const cosE=Math.cos(E), sinE=Math.sin(E); const r=a*(1-e*cosE); const nu=Math.atan2(Math.sqrt(1-e*e)*sinE, cosE-e);
      const x_orb=r*Math.cos(nu), y_orb=r*Math.sin(nu);
      const cosw=Math.cos(arg_peri), sinw=Math.sin(arg_peri); const cosO=Math.cos(omega_node), sinO=Math.sin(omega_node); const cosi=Math.cos(incl), sini=Math.sin(incl);
      const x1=x_orb*cosw - y_orb*sinw; const y1=x_orb*sinw + y_orb*cosw; const z1=0;
      const x2=x1; const y2=y1*cosi - z1*sini; const z2=y1*sini + z1*cosi;
      return new THREE.Vector3( x2*cosO - y2*sinO, x2*sinO + y2*cosO, z2 );
    }

    // ======== Estado + Calendário =========
    let playing=true; let speedDaysPerSec=3; let showLabels=true; let showTrails=true; let showStars=true; let showMoonOrbit=true; let showPlanetOrbits=true;

    // Data inicial = hoje (UTC truncado)
    const todayUTC=new Date();
    const startDays=daysSinceEpoch(Date.UTC(todayUTC.getUTCFullYear(),todayUTC.getUTCMonth(),todayUTC.getUTCDate()));
    let simDays = startDays; // dias desde J2000
    let last = performance.now();

    // ======== UI refs =========
    const elPlay=document.getElementById('playPause'); const elSpeed=document.getElementById('speed'); const elSpeedVal=document.getElementById('speedVal');
    const elToggleView=document.getElementById('toggleView');
    const elCkLabels=document.getElementById('ckLabels'); const elCkTrails=document.getElementById('ckTrails'); const elCkStars=document.getElementById('ckStars');
    const elCkMoonOrbit=document.getElementById('ckMoonOrbit'); const elCkPlanetOrbits=document.getElementById('ckPlanetOrbits');
    const elDatePicker=document.getElementById('datePicker'); const elDateText=document.getElementById('dateText'); const elToday=document.getElementById('todayBtn');
    const btnZoomEarth=document.getElementById('zoomEarth'); const btnZoomSystem=document.getElementById('zoomSystem'); const btnZoomMars=document.getElementById('zoomMars');

    function updateDateUI(){ const d=isoDateFromDays(simDays); const iso=d.toISOString().slice(0,10); elDateText.textContent=iso; elDatePicker.value=iso; }
    updateDateUI();

    // ======== Main loop =========
    function tick(now){
      const dt=(now-last)/1000; last=now; if(playing) simDays += speedDaysPerSec * dt;

      // Planetas
      const posCache = {};
      for(const [name,p] of Object.entries(PLANETS)){
        const pos = orbitalPosition({ t: simDays, T:p.T, a:p.a, e:p.e, incl:p.i, omega_node:p.O, arg_peri:p.w });
        planetObjs[name].group.position.copy(pos);
        if(name==='Earth'){
          // rotação de Terra + nuvens
          planetObjs[name].mesh.rotation.y += (2*Math.PI) * (speedDaysPerSec * dt);
          planetObjs[name].group.userData.clouds.rotation.y += (2*Math.PI) * (speedDaysPerSec * dt) * 1.02;
        }
        posCache[name] = pos;
      }

      // Lua em torno da Terra
      const moonRel = orbitalPosition({ t: simDays, T:MOON_D, a:0.00257, e:0.0549, incl:5.145*DEG, omega_node:125.08*DEG, arg_peri:318.15*DEG });
      const moonPos = posCache.Earth.clone().add(moonRel);
      moonGroup.position.copy(moonPos);

      // Travamento por maré da Lua
      const toEarth = posCache.Earth.clone().sub(moonGroup.position).normalize();
      const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), toEarth);
      moonGroup.quaternion.slerp(quat, 0.18);

      // Trilhas
      if(showTrails){
        pushTrail(planetObjs.Earth.group.position, trails.Earth);
        pushTrail(moonGroup.position, trails.Moon);
        pushTrail(planetObjs.Mercury.group.position, trails.Mercury);
        pushTrail(planetObjs.Venus.group.position, trails.Venus);
        pushTrail(planetObjs.Mars.group.position, trails.Mars);
      }
      trails.Earth.line.visible = trails.Moon.line.visible = showTrails;
      trails.Mercury.line.visible = trails.Venus.line.visible = trails.Mars.line.visible = showTrails;

      // Exibir/ocultar órbitas
      for(const name of Object.keys(planetObjs)) planetObjs[name].orbitLine.visible = showPlanetOrbits;
      moonOrbitGuide.visible = showMoonOrbit;

      // Estrelas
      starsGroup.visible = showStars;

      // Render
      controls.update();
      if(usingOrtho) renderer.render(scene,cameraOrtho); else renderer.render(scene,camera);

      // Atualiza UI da data ~10x/s
      if(Math.floor(now*10)%10===0){ updateDateUI(); }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // ======== Estrelas =========
    const starsGroup=new THREE.Group(); scene.add(starsGroup); makeStars();
    function makeStars(){
      starsGroup.clear(); const starGeom=new THREE.BufferGeometry(); const count=5000; const pos=new Float32Array(count*3);
      for(let i=0;i<count;i++){ const r=80+Math.random()*120, phi=Math.acos(2*Math.random()-1), theta=2*Math.PI*Math.random(); pos[i*3]=r*Math.sin(phi)*Math.cos(theta); pos[i*3+1]=r*Math.sin(phi)*Math.sin(theta); pos[i*3+2]=r*Math.cos(phi);} starGeom.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); starsGroup.add(new THREE.Points(starGeom,new THREE.PointsMaterial({size:0.08})));
    }

    // ======== UI handlers =========
    elPlay.addEventListener('click',()=>{ playing=!playing; elPlay.textContent=playing?'⏸️ Pausar':'▶️ Reproduzir'; elPlay.className='btn '+(playing?'play':'pause'); });
    elSpeed.addEventListener('input',e=>{ speedDaysPerSec=parseFloat(e.target.value); elSpeedVal.textContent=speedDaysPerSec.toFixed(2)+' d/s'; });
    elToggleView.addEventListener('click',()=>{ usingOrtho=!usingOrtho; elToggleView.textContent=usingOrtho?'👁️ Vista 3D':'📐 Vista Top'; controls.enableRotate=!usingOrtho; });
    document.getElementById('ckLabels').addEventListener('change',e=>{ showLabels=e.target.checked; for(const k of Object.keys(planetObjs)) planetObjs[k].label.visible=showLabels; labelMoon.visible=showLabels; });
    document.getElementById('ckTrails').addEventListener('change',e=> showTrails=e.target.checked);
    document.getElementById('ckStars').addEventListener('change',e=> showStars=e.target.checked);
    elCkMoonOrbit.addEventListener('change',e=> showMoonOrbit=e.target.checked);
    elCkPlanetOrbits.addEventListener('change',e=> showPlanetOrbits=e.target.checked);

    elDatePicker.addEventListener('change',()=>{ const d=elDatePicker.valueAsDate; if(d){ simDays = daysSinceEpoch(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }});
    elToday.addEventListener('click',()=>{ const n=new Date(); simDays=daysSinceEpoch(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())); updateDateUI(); });

    btnZoomEarth.addEventListener('click',()=> smoothZoomTo(planetObjs.Earth.group.position, 0.12));
    btnZoomSystem.addEventListener('click',()=> smoothZoomTo(new THREE.Vector3(0,0,0), 5.0));
    btnZoomMars.addEventListener('click',()=> smoothZoomTo(planetObjs.Mars.group.position, 0.16));

    function smoothZoomTo(target, distance){
      const dir = camera.position.clone().sub(controls.target).normalize();
      controls.target.copy(target);
      const newPos = target.clone().add(dir.multiplyScalar(distance));
      tweenTo(camera.position, newPos, 300);
    }
    function tweenTo(vec, to, dur){ const from=vec.clone(); const t0=performance.now(); const ease=x=>1-Math.pow(1-x,3);
      function step(){ const k=Math.min(1,(performance.now()-t0)/dur); const e=ease(k); vec.lerpVectors(from,to,e); if(k<1) requestAnimationFrame(step); }
      requestAnimationFrame(step);
    }

    // ======== Resize =========
    window.addEventListener('resize', ()=>{
      const w=window.innerWidth, h=window.innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
      const a=w/h, H=orthoH; cameraOrtho.left=-H*a; cameraOrtho.right=H*a; cameraOrtho.updateProjectionMatrix();
    }, {passive:true});

    // ======== SELF-TESTS =========
    (function runSelfTests(){
      const tests=[]; const pass=(name,cond)=>tests.push({name,ok:!!cond});
      pass('THREE importado', !!THREE && !!THREE.Scene);
      pass('OrbitControls importado', typeof OrbitControls==='function');
      pass('Renderer criado', renderer instanceof THREE.WebGLRenderer);
      pass('Controls instanciado', controls instanceof OrbitControls);
      pass('Terra mesh presente', !!planetObjs.Earth && planetObjs.Earth.mesh.isMesh===true);
      pass('Lua mesh presente', !!moonMesh && moonMesh.isMesh===true);
      pass('Mercúrio presente', !!planetObjs.Mercury && planetObjs.Mercury.mesh.isMesh===true);
      pass('Vênus presente', !!planetObjs.Venus && planetObjs.Venus.mesh.isMesh===true);
      pass('Marte presente', !!planetObjs.Mars && planetObjs.Mars.mesh.isMesh===true);
      pass('Órbita da Terra (linha) presente', planetObjs.Earth.orbitLine.isLine===true || planetObjs.Earth.orbitLine.type==='Line');
      pass('Órbita de Marte (linha) presente', planetObjs.Mars.orbitLine.isLine===true || planetObjs.Mars.orbitLine.type==='Line');

      // Teste: avanço de data quando em play
      const beforeDays = simDays; setTimeout(()=>{
        const advanced = simDays > beforeDays; console.log('%c[Teste] Data avança em play:', 'color:'+(advanced?'#16a34a':'#ef4444'), advanced);
        // Zoom Terra e Sistema
        btnZoomSystem.click(); setTimeout(()=>{ const far = camera.position.distanceTo(controls.target) > 1.5; console.log('%c[Teste] Zoom sistema funciona:', 'color:'+(far?'#16a34a':'#ef4444'), far); }, 450);
        setTimeout(()=>{ btnZoomEarth.click(); setTimeout(()=>{ const close = camera.position.distanceTo(controls.target) < 0.35; console.log('%c[Teste] Zoom Terra funciona:', 'color:'+(close?'#16a34a':'#ef4444'), close); }, 450); }, 900);
      }, 350);

      // Distâncias médias aproximadas em UA
      setTimeout(()=>{
        const dEM = planetObjs.Earth.group.position.length();
        const dMM = planetObjs.Mars.group.position.length();
        const okE = dEM>0.95 && dEM<1.05; const okM = dMM>1.4 && dMM<1.7;
        console.log('%c[Teste] Terra ~1 UA:', 'color:'+(okE?'#16a34a':'#ef4444'), dEM.toFixed(3));
        console.log('%c[Teste] Marte ~1.52 UA:', 'color:'+(okM?'#16a34a':'#ef4444'), dMM.toFixed(3));
      }, 1200);

      for(const t of tests){ console.log('%c[Teste] '+t.name+': '+(t.ok?'OK':'FALHOU'), 'color:'+(t.ok?'#16a34a':'#ef4444')); }
    })();
  </script>
</body>
</html>
